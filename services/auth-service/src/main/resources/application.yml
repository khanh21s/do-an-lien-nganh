spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_password}
    driver-class-name: org.postgresql.Driver
  # Flyway owns every schema change (README "Operations notes"): db/migration/V<n>__*.sql, applied
  # on startup before Hibernate validates. Existing/fresh volumes already have the schema from
  # init-db.sql, so the first start only records the baseline (V1, never executed there).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8001}

jwt:
  secret: ${JWT_SECRET:}
  expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY_SECONDS:604800}

internal:
  token: ${INTERNAL_TOKEN:}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  apple:
    client-id: ${APPLE_CLIENT_ID:}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}

admin:
  emails: ${ADMIN_EMAILS:admin@parroto.com}
  # Seeds the single admin account on startup (config/AdminBootstrap).
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    reset-password: ${ADMIN_PASSWORD_RESET:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.parroto: ${LOGGING_LEVEL_COM_PARROTO:DEBUG}
