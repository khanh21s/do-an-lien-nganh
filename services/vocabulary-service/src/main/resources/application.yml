spring:
  application:
    name: vocabulary-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vocabulary_db}
    username: ${SPRING_DATASOURCE_USERNAME:vocabulary_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vocabulary_password}
    driver-class-name: org.postgresql.Driver
  # Flyway owns every schema change (README "Operations notes"): db/migration/V<n>__*.sql, applied
  # on startup before Hibernate validates. Existing/fresh volumes already have the schema from
  # init-db.sql, so the first start only records the baseline (V1, never executed there).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # P2-C import uploads: the service itself rejects files > 2 MB with a Vietnamese 400; the
  # container limit is a bit higher so that check (not a generic multipart error) answers.
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8004}

jwt:
  secret: ${JWT_SECRET:}

internal:
  token: ${INTERNAL_TOKEN:}

admin:
  emails: ${ADMIN_EMAILS:admin@parroto.com}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}

services:
  subscription-service-url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8005}
  practice-service-url: ${PRACTICE_SERVICE_URL:http://localhost:8003}

# P2-C dictionary: Free Dictionary API (English definitions/IPA/audio), results cached in Redis.
dictionary:
  api-url: ${DICTIONARY_API_URL:https://api.dictionaryapi.dev/api/v2/entries/en}
  external-enabled: ${DICTIONARY_EXTERNAL_ENABLED:true}
  connect-timeout-ms: ${DICTIONARY_CONNECT_TIMEOUT_MS:1500}
  read-timeout-ms: ${DICTIONARY_READ_TIMEOUT_MS:2500}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.parroto: ${LOGGING_LEVEL_COM_PARROTO:DEBUG}
