spring:
  application:
    name: vocabulary-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vocabulary_db}
    username: ${SPRING_DATASOURCE_USERNAME:vocabulary_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vocabulary_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8004}

jwt:
  secret: ${JWT_SECRET:}

internal:
  token: ${INTERNAL_TOKEN:}

admin:
  emails: ${ADMIN_EMAILS:admin@parroto.com}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}

services:
  subscription-service-url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8005}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.parroto: ${LOGGING_LEVEL_COM_PARROTO:DEBUG}
