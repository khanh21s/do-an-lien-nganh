spring:
  application:
    name: practice-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/practice_db}
    username: ${SPRING_DATASOURCE_USERNAME:practice_user}
    password: ${SPRING_DATASOURCE_PASSWORD:practice_password}
    driver-class-name: org.postgresql.Driver
  mvc:
    formcontent:
      filter:
        enabled: false
  # Flyway owns every schema change (README "Operations notes"): db/migration/V<n>__*.sql, applied
  # on startup before Hibernate validates. Existing/fresh volumes already have the schema from
  # init-db.sql, so the first start only records the baseline (V1, never executed there).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8003}

jwt:
  secret: ${JWT_SECRET:}

internal:
  token: ${INTERNAL_TOKEN:}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}

services:
  content-service-url: ${CONTENT_SERVICE_URL:http://localhost:8002}
  # P2-B: XP events of saved attempts (POST /internal/gamification/events); empty = disabled
  vocabulary-service-url: ${VOCABULARY_SERVICE_URL:http://localhost:8004}
  # P2-A1: premium check for Pro lessons (GET /internal/subscriptions/{userId}/active)
  subscription-service-url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8005}

# P2-A1: admins bypass the Pro-lesson practice gate (shared AdminGuard)
admin:
  emails: ${ADMIN_EMAILS:admin@parroto.com}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:parroto-dev-bucket}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

azure:
  speech:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:eastus}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.parroto: ${LOGGING_LEVEL_COM_PARROTO:DEBUG}

app:
  storage:
    provider: ${STORAGE_PROVIDER:auto}
    local-root: ${MEDIA_ROOT:/data/media}
  speech:
    provider: ${SPEECH_PROVIDER:auto}
