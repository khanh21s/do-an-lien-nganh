spring:
  application:
    name: practice-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/practice_db}
    username: ${SPRING_DATASOURCE_USERNAME:practice_user}
    password: ${SPRING_DATASOURCE_PASSWORD:practice_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8003}

jwt:
  secret: ${JWT_SECRET:}

internal:
  token: ${INTERNAL_TOKEN:}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}

services:
  content-service-url: ${CONTENT_SERVICE_URL:http://localhost:8002}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:parroto-dev-bucket}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

azure:
  speech:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:eastus}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.parroto: ${LOGGING_LEVEL_COM_PARROTO:DEBUG}

app:
  storage:
    provider: ${STORAGE_PROVIDER:auto}
    local-root: ${MEDIA_ROOT:/data/media}
  speech:
    provider: ${SPEECH_PROVIDER:auto}
