spring:
  application:
    name: subscription-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subscription_db}
    username: ${SPRING_DATASOURCE_USERNAME:subscription_user}
    password: ${SPRING_DATASOURCE_PASSWORD:subscription_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8005}

jwt:
  secret: ${JWT_SECRET:}

internal:
  token: ${INTERNAL_TOKEN:}

services:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8001}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}

mail:
  from: ${MAIL_FROM:noreply@parroto.com}
  enabled: ${MAIL_HOST:}

vnpay:
  pay-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn}/paymentv2/vpcpay.html
  tmn-code: ${VNPAY_MERCHANT_ID:}
  hash-secret: ${VNPAY_SECRET:}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8000/subscriptions/payment-callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.parroto: ${LOGGING_LEVEL_COM_PARROTO:DEBUG}
