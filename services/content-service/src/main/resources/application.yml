spring:
  application:
    name: content-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/content_db}
    username: ${SPRING_DATASOURCE_USERNAME:content_user}
    password: ${SPRING_DATASOURCE_PASSWORD:content_password}
    driver-class-name: org.postgresql.Driver
  # Flyway owns every schema change (README "Operations notes"): db/migration/V<n>__*.sql, applied
  # on startup before Hibernate validates. Existing/fresh volumes already have the schema from
  # init-db.sql, so the first start only records the baseline (V1, never executed there).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  servlet:
    multipart:
      max-file-size: 50MB
      # slightly above the file limit so a 50MB file plus multipart overhead/fields still fits (ADM-04)
      max-request-size: 51MB

server:
  port: ${SERVER_PORT:8002}

jwt:
  secret: ${JWT_SECRET:}

internal:
  token: ${INTERNAL_TOKEN:}

admin:
  emails: ${ADMIN_EMAILS:admin@parroto.com}
  # 403 text of the shared AdminGuard (services/common); content-service has always used English.
  forbidden-message: Admin privileges required

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:parroto-dev-bucket}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}

cache:
  lesson-ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.parroto: ${LOGGING_LEVEL_COM_PARROTO:DEBUG}

app:
  storage:
    provider: ${STORAGE_PROVIDER:auto}
    local-root: ${MEDIA_ROOT:/data/media}
