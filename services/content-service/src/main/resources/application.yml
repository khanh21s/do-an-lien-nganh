spring:
  application:
    name: content-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/content_db}
    username: ${SPRING_DATASOURCE_USERNAME:content_user}
    password: ${SPRING_DATASOURCE_PASSWORD:content_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 50MB
      # slightly above the file limit so a 50MB file plus multipart overhead/fields still fits (ADM-04)
      max-request-size: 51MB

server:
  port: ${SERVER_PORT:8002}

jwt:
  secret: ${JWT_SECRET:dev_change_this_in_production_use_strong_random_key_minimum_32_chars}

admin:
  emails: ${ADMIN_EMAILS:admin@parroto.com}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:parroto-dev-bucket}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:3000}

cache:
  lesson-ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.parroto: ${LOGGING_LEVEL_COM_PARROTO:DEBUG}

app:
  storage:
    provider: ${STORAGE_PROVIDER:auto}
    local-root: ${MEDIA_ROOT:/data/media}
